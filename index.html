<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f1ea" />
    <meta name="description" content="Approvd — hybrid on-device + cloud spend-policy agent (#BuildHybridAI Web/Chrome)" />
    <title>Approvd — hybrid spend policy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div>
          <h1>Approvd</h1>
          <p class="hint" style="margin:0">Spend policies that the model cannot override · hybrid Nano + cloud</p>
        </div>
        <div class="badges">
          <span class="badge" id="ai-badge">AI: starting…</span>
          <span class="badge" id="mode-badge">Mode: mock</span>
        </div>
      </header>

      <nav class="nav" id="nav">
        <button type="button" data-screen="console" class="active">Console</button>
        <button type="button" data-screen="approvals">Approvals</button>
        <button type="button" data-screen="policy">Policy</button>
        <button type="button" data-screen="disputes">Disputes</button>
      </nav>

      <main id="screen" class="card"></main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
